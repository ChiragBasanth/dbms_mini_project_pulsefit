<text x="70" y="1630" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#263238">Booking coach = selected slot’s trainer. “Coaches” is an implied association, not an additional independent SQL foreign key.</text>
<text x="70" y="1672" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#263238">A slot has many historical bookings, but ≤1 CONFIRMED row. Audit is structurally optional; normal booking triggers append records.</text>
<text x="70" y="1714" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#263238">Exercise is an independent SQL catalog. Stored embeddings are ordinary attributes here, not SQL-generated or virtual values.</text>
<text x="70" y="1770" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#263238">EXTENDED CHEN</text>
<text x="340" y="1770" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#263238">Rectangle: entity · Diamond: relationship · Oval: stored attribute · Underlined: primary identifier</text>
<text x="70" y="1813" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#263238">Double oval: multivalued specialties · Single line: partial participation (min 0) · Double line: total participation (min 1)</text>
<text x="70" y="1856" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#263238">(min,max) beside an entity counts its relationship participations; N = many. No Crow’s Foot endpoints; no derived-attribute ovals.</text></svg>