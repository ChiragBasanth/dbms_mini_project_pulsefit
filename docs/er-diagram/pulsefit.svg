<text x="70" y="635" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#263238">Role condition: profiles are disjoint; the stored user role must qualify for the profile type.</text>
<text x="70" y="675" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#263238">A user is not required by SQL to have a profile. The application creates it during registration.</text>
<text x="70" y="1750" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#263238">EXTENDED CHEN</text>
<text x="340" y="1750" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#263238">Rectangle: entity · Diamond: relationship · Oval: stored attribute · Underlined: primary identifier</text>
<text x="70" y="1793" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#263238">Double oval: multivalued specialties · Single line: partial participation (min 0) · Double line: total participation (min 1)</text>
<text x="70" y="1836" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#263238">(min,max) beside an entity counts its relationship participations; N = many. No Crow’s Foot endpoints; no derived-attribute ovals.</text></svg>