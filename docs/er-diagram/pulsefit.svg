<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1130" viewBox="0 0 1560 1130"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2b6557"/></marker></defs><rect width="1560" height="1130" fill="#f5f7f3"/><text x="40" y="48" font-family="Arial" font-size="30" font-weight="bold" fill="#143c32">PulseFit — active database relationships</text><text x="40" y="86" font-family="Arial" font-size="19" fill="#42594f">PostgreSQL 384D MiniLM model · migrations 001–003 · 16 November 2026</text><path d="M460 205 H550" fill="none" stroke="#2b6557" stroke-width="3"  marker-end="url(#arrow)"/><text x="465" y="190" font-family="Arial" font-size="18" fill="#214f42">1 → 0..1</text><path d="M250 335 V440" fill="none" stroke="#2b6557" stroke-width="3"  marker-end="url(#arrow)"/><text x="265" y="390" font-family="Arial" font-size="18" fill="#214f42">1 → 0..1</text><path d="M460 535 H550" fill="none" stroke="#2b6557" stroke-width="3"  marker-end="url(#arrow)"/><text x="465" y="520" font-family="Arial" font-size="18" fill="#214f42">1 → 0..N</text><path d="M970 535 H1060" fill="none" stroke="#2b6557" stroke-width="3"  marker-end="url(#arrow)"/><text x="975" y="520" font-family="Arial" font-size="18" fill="#214f42">1 → 0..N</text><path d="M970 205 H1270 V440" fill="none" stroke="#2b6557" stroke-width="3"  marker-end="url(#arrow)"/><text x="1130" y="190" font-family="Arial" font-size="18" fill="#214f42">1 → 0..N</text><path d="M1270 645 V770" fill="none" stroke="#2b6557" stroke-width="3"  marker-end="url(#arrow)"/><text x="1285" y="710" font-family="Arial" font-size="18" fill="#214f42">1 → 0..N</text><path d="M760 335 V390 H1010 V715 H760 V770" fill="none" stroke="#2b6557" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/><text x="770" y="742" font-family="Arial" font-size="18" fill="#214f42">logical userId</text><rect x="40" y="130" width="420" height="205" rx="14" fill="white" stroke="#a8c3b5" stroke-width="2"/><rect x="40" y="130" width="420" height="47" rx="14" fill="#174c3d"/><text x="58" y="161" font-family="Arial" font-size="22" font-weight="bold" fill="white">users</text><text x="58" y="209" font-family="Arial" font-size="18" fill="#213c32">id UUID PK</text><text x="58" y="240" font-family="Arial" font-size="18" fill="#213c32">name, email UNIQUE, password_hash</text><text x="58" y="271" font-family="Arial" font-size="18" fill="#213c32">role MEMBER | TRAINER</text><text x="58" y="302" font-family="Arial" font-size="18" fill="#213c32">created_at; UNIQUE(id,role)</text><rect x="550" y="130" width="420" height="205" rx="14" fill="white" stroke="#a8c3b5" stroke-width="2"/><rect x="550" y="130" width="420" height="47" rx="14" fill="#174c3d"/><text x="568" y="161" font-family="Arial" font-size="22" font-weight="bold" fill="white">member_profiles</text><text x="568" y="209" font-family="Arial" font-size="18" fill="#213c32">user_id PK; role = MEMBER</text><text x="568" y="240" font-family="Arial" font-size="18" fill="#213c32">FK (user_id,role) → users</text><text x="568" y="271" font-family="Arial" font-size="18" fill="#213c32">fitness_goals (≤2000 chars)</text><rect x="40" y="440" width="420" height="205" rx="14" fill="white" stroke="#a8c3b5" stroke-width="2"/><rect x="40" y="440" width="420" height="47" rx="14" fill="#174c3d"/><text x="58" y="471" font-family="Arial" font-size="22" font-weight="bold" fill="white">trainer_profiles</text><text x="58" y="519" font-family="Arial" font-size="18" fill="#213c32">user_id PK; role = TRAINER</text><text x="58" y="550" font-family="Arial" font-size="18" fill="#213c32">FK (user_id,role) → users</text><text x="58" y="581" font-family="Arial" font-size="18" fill="#213c32">bio, specialties[], experience_years</text><text x="58" y="612" font-family="Arial" font-size="18" fill="#213c32">location; embedding vector(384), model</text><rect x="550" y="440" width="420" height="205" rx="14" fill="white" stroke="#a8c3b5" stroke-width="2"/><rect x="550" y="440" width="420" height="47" rx="14" fill="#174c3d"/><text x="568" y="471" font-family="Arial" font-size="22" font-weight="bold" fill="white">trainer_availability</text><text x="568" y="519" font-family="Arial" font-size="18" fill="#213c32">id UUID PK; trainer_id FK</text><text x="568" y="550" font-family="Arial" font-size="18" fill="#213c32">starts_at, ends_at, status</text><text x="568" y="581" font-family="Arial" font-size="18" fill="#213c32">UNIQUE(id,trainer_id)</text><text x="568" y="612" font-family="Arial" font-size="18" fill="#213c32">GiST: no overlapping trainer ranges</text><rect x="1060" y="440" width="420" height="205" rx="14" fill="white" stroke="#a8c3b5" stroke-width="2"/><rect x="1060" y="440" width="420" height="47" rx="14" fill="#174c3d"/><text x="1078" y="471" font-family="Arial" font-size="22" font-weight="bold" fill="white">bookings</text><text x="1078" y="519" font-family="Arial" font-size="18" fill="#213c32">id UUID PK; member_id FK</text><text x="1078" y="550" font-family="Arial" font-size="18" fill="#213c32">slot_id + trainer_id composite FK</text><text x="1078" y="581" font-family="Arial" font-size="18" fill="#213c32">status; created_at</text><text x="1078" y="612" font-family="Arial" font-size="18" fill="#213c32">Partial UNIQUE(slot_id) if CONFIRMED</text><rect x="1060" y="770" width="420" height="205" rx="14" fill="white" stroke="#a8c3b5" stroke-width="2"/><rect x="1060" y="770" width="420" height="47" rx="14" fill="#174c3d"/><text x="1078" y="801" font-family="Arial" font-size="22" font-weight="bold" fill="white">booking_audit</text><text x="1078" y="849" font-family="Arial" font-size="18" fill="#213c32">id BIGINT IDENTITY PK</text><text x="1078" y="880" font-family="Arial" font-size="18" fill="#213c32">booking_id FK → bookings</text><text x="1078" y="911" font-family="Arial" font-size="18" fill="#213c32">old_status, new_status, changed_at</text><text x="1078" y="942" font-family="Arial" font-size="18" fill="#213c32">App cannot directly write/delete audit</text><rect x="40" y="770" width="420" height="205" rx="14" fill="white" stroke="#a8c3b5" stroke-width="2"/><rect x="40" y="770" width="420" height="47" rx="14" fill="#174c3d"/><text x="58" y="801" font-family="Arial" font-size="22" font-weight="bold" fill="white">exercises</text><text x="58" y="849" font-family="Arial" font-size="18" fill="#213c32">id UUID PK; name UNIQUE</text><text x="58" y="880" font-family="Arial" font-size="18" fill="#213c32">muscle_group, description</text><text x="58" y="911" font-family="Arial" font-size="18" fill="#213c32">difficulty, category CHECKs</text><text x="58" y="942" font-family="Arial" font-size="18" fill="#213c32">embedding vector(384), embedding_model</text><rect x="550" y="770" width="420" height="205" rx="14" fill="white" stroke="#a8c3b5" stroke-width="2"/><rect x="550" y="770" width="420" height="47" rx="14" fill="#174c3d"/><text x="568" y="801" font-family="Arial" font-size="22" font-weight="bold" fill="white">MongoDB: workout_logs</text><text x="568" y="849" font-family="Arial" font-size="18" fill="#213c32">_id ObjectId; userId UUID string</text><text x="568" y="880" font-family="Arial" font-size="18" fill="#213c32">performedAt, createdAt, workoutType</text><text x="568" y="911" font-family="Arial" font-size="18" fill="#213c32">exercises[{name, sets[{metrics}]}]</text><text x="568" y="942" font-family="Arial" font-size="18" fill="#213c32">Logical member link; no cross-store FK</text><text x="40" y="1040" font-family="Arial" font-size="19" fill="#42594f">Arrows run from parent to child. Profile role discriminators enforce the correct subtype.</text><text x="40" y="1074" font-family="Arial" font-size="19" fill="#42594f">RLS: profiles, availability, bookings, audit. Migration metadata table schema_migrations is omitted from this domain view.</text></svg>